name: Deploy Bizarreio

on:
  push:
    branches:
      - bizarreio
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-bizarreio
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.8.0
          run_install: false
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: Install NPM dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v5
        with:
          path: build
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v5
